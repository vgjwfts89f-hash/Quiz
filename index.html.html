<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كويز ثقافة المظهر</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#2a2328;--mu:#7a6f76;--ac:#7b2d45;--ok:#1f8a4c;--okb:#e3f5ea;--no:#c0392b;--nob:#fbe6e3;--bd:#e6dde1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b161a;--card:#262026;--tx:#f1e9ee;--mu:#a99ea5;--ac:#e08aa5;--ok:#59d08a;--okb:#1c3527;--no:#ff8b7d;--nob:#3b2220;--bd:#3a3238}}
:root[data-theme="dark"]{--bg:#1b161a;--card:#262026;--tx:#f1e9ee;--mu:#a99ea5;--ac:#e08aa5;--ok:#59d08a;--okb:#1c3527;--no:#ff8b7d;--nob:#3b2220;--bd:#3a3238}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.w{max-width:720px;margin:auto;padding:16px}
h1{font-size:22px;color:var(--ac);margin:8px 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid var(--bd)}
.s{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:14px 0}
.s h2{font-size:16px;margin:0 0 8px;color:var(--ac)}
.q{margin:12px 0;padding-top:10px;border-top:1px dashed var(--bd)}
.t{font-size:12px;color:var(--mu)}
.qb{display:flex;gap:12px;align-items:center}
.qb img{height:110px;max-width:40%;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--bd)}
.o{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;text-align:right;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer}
.o:hover{border-color:var(--ac)}
.o.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.o.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.o:disabled{cursor:default}
.nt{margin:8px 0 2px;padding:10px 12px;border-radius:10px;background:var(--nob);border:1px solid var(--no);color:var(--tx);font-size:14px}
.nt b{color:var(--no)}
svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:middle}
.sy{display:inline-flex;gap:8px;margin-inline-start:6px}
button.r{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer;margin:10px 0}
#res{font-size:18px;font-weight:700;text-align:center;margin:12px 0}
</style></head><body><div class="w">
